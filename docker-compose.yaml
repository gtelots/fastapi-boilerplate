services:
  app-dev:
    image: ${REGISTRY_HOST}/${ORG_NAME}/${REPO_NAME}:${IMAGE_TAG}
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
        - BASE_IMAGE=${BASE_IMAGE}
        - TZ=${TZ}
        - APP_PORT=${APP_PORT}
      target: development
    env_file:
      - .env
    ports:
      - "${APP_FORWARD_PORT}:${APP_PORT}"
    volumes:
      - .:/app
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "${APP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${APP_POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${APP_POSTGRES_PWD:-app}
      - POSTGRES_DB=${APP_POSTGRES_DATABASE:-app_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${APP_POSTGRES_USER:-app} -d ${APP_POSTGRES_DATABASE:-app_development}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
