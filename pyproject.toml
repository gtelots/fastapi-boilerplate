[project]
name = "fastapi-boilerplate"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  # 1. Core Web Framework
  "fastapi",
  "uvicorn[standard]",
  # 2. Database ORM & Migration
  "alembic",
  "sqlalchemy[asyncio]",
  "sqlalchemy-utils",
  "psycopg2-binary",
  "asyncpg",
  "greenlet",
  # 3. Data Validation & Configuration
  "pydantic",
  "pydantic-settings",
  "pydantic-extra-types",
  "pydantic-ai-slim[openai]",
  # 4. Logging & Monitoring
  "structlog",
  "sentry-sdk[fastapi,sqlalchemy]",
  "logfire[fastapi,httpx,sqlalchemy,redis]",
  # 5. HTTP & Utilities
  "httpx",
  "safe-redirect-url",
  "python-slugify",
  "python-multipart",
  "typer",
  "makefun",
  # 6. Caching, Queue
  "redis",
  "dramatiq",
  "apscheduler",
]

[dependency-groups]
dev = [
  # 1. Code Analysis
  "ruff",
  "mypy",
  "pre-commit",
  # 2. Testing Frameworks & Plugins
  "pytest",
  "pytest-sugar",
  "pytest-mock",
  "pytest-asyncio",
  "pytest-subtests",
  "pytest-recording",
  "pytest-cov",
  "pytest-xdist[psutil]",
  "coverage",
  # 3. Mock Data
  "freezegun",
  "fakeredis[lua]",
  # 4. Type Stubs (for IDE & Static Typing)
  "types-redis",
  "types-python-slugify",
  "types-requests",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
] # See: https://github.com/nedbat/coveragepy/issues/831

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "T20", # flake8-print
  "B039" # flake8-bugbear
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "UP040", # new type alias syntax not supported by mypy yet
  "F841",  # remove unused variables
  "UP040", # new type alias syntax not supported by mypy yet
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["F401"]  # unused imports
"scripts/*" = ["T20"]      # print statements
"tests/*" = ["T20"]        # print statements

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
warn_untyped_fields = true
